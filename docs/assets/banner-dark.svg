<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Taildrop to Mac: Drop files and folders on Ubuntu, receive them on your Mac over Tailscale.">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0d1117"/>
    <stop offset="1" stop-color="#151b26"/>
  </linearGradient>
  <radialGradient id="glow" cx="0.78" cy="0.5" r="0.45">
    <stop offset="0" stop-color="#3584e4" stop-opacity="0.18"/>
    <stop offset="1" stop-color="#3584e4" stop-opacity="0"/>
  </radialGradient>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="12" cy="12" r="1.2" fill="#2b374b"/>
  </pattern>
  <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0.38" stop-color="#fff" stop-opacity="0"/>
    <stop offset="0.95" stop-color="#fff" stop-opacity="0.9"/>
  </linearGradient>
  <mask id="dotmask">
    <rect width="1280" height="320" fill="url(#fade)"/>
  </mask>
</defs>

<rect x="0.5" y="0.5" width="1279" height="319" rx="16" fill="url(#bg)" stroke="#2a3444"/>
<rect width="1280" height="320" rx="16" fill="url(#glow)"/>
<rect width="1280" height="320" rx="16" fill="url(#dots)" mask="url(#dotmask)"/>

<!-- Left Brand & Copy -->
<g transform="translate(64, 52)">
  <!-- Tailscale-style 3x3 mesh emblem -->
  <circle cx="4" cy="4" r="3" fill="#4b5a72"/>
  <circle cx="15" cy="4" r="3" fill="#62a0ea"/>
  <circle cx="26" cy="4" r="3" fill="#4b5a72"/>
  <circle cx="4" cy="15" r="3" fill="#62a0ea"/>
  <circle cx="15" cy="15" r="3" fill="#3584e4"/>
  <circle cx="26" cy="15" r="3" fill="#62a0ea"/>
  <circle cx="4" cy="26" r="3" fill="#4b5a72"/>
  <circle cx="15" cy="26" r="3" fill="#2ec27e"/>
  <circle cx="26" cy="26" r="3" fill="#4b5a72"/>

  <rect x="42" y="2" width="112" height="26" rx="6" fill="#17202e" stroke="#2d3b52"/>
  <text x="98" y="19" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="600" fill="#99c1f1">taildrop-gui</text>
</g>

<text x="64" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="52" font-weight="700" letter-spacing="-1.2" fill="#f0f4f8">Taildrop to Mac</text>
<text x="64" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="20" fill="#9aa7b8">Drop files and folders on Ubuntu.</text>
<text x="64" y="207" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="20" fill="#9aa7b8">Receive them on your Mac over Tailscale.</text>

<rect x="64" y="238" width="166" height="30" rx="15" fill="#18202c" stroke="#2b384c"/><text x="147" y="258" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#c9d4e2">GTK4 + Libadwaita</text>
<rect x="240" y="238" width="154" height="30" rx="15" fill="#18202c" stroke="#2b384c"/><text x="317" y="258" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#c9d4e2">Auto-Zip Folders</text>
<rect x="404" y="238" width="166" height="30" rx="15" fill="#18202c" stroke="#2b384c"/><text x="487" y="258" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#c9d4e2">Tailscale Taildrop</text>

