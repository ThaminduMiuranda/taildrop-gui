<rect x="844" y="192" width="42" height="16" rx="8" fill="#1b2b3f"/><text x="865" y="203" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="600" fill="#99c1f1">Ready</text>

