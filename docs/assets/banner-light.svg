<rect x="656" y="36" width="268" height="248" rx="14" fill="#fafafa" stroke="#cbd5e1" stroke-width="1.5"/>
<path d="M656 50a14 14 0 0 1 14-14h240a14 14 0 0 1 14 14v22H656V50z" fill="#eef1f5"/>
<line x1="656" y1="72" x2="924" y2="72" stroke="#dce2eb"/>
