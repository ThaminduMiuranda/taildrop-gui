<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Taildrop to Mac: Drop files and folders on Ubuntu, receive them on your Mac over Tailscale.">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset="1" stop-color="#f3f6fb"/>
  </linearGradient>
  <radialGradient id="glow" cx="0.78" cy="0.5" r="0.45">
    <stop offset="0" stop-color="#3584e4" stop-opacity="0.12"/>
    <stop offset="1" stop-color="#3584e4" stop-opacity="0"/>
  </radialGradient>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="12" cy="12" r="1.2" fill="#d4dde9"/>
  </pattern>
  <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0.38" stop-color="#fff" stop-opacity="0"/>
    <stop offset="0.95" stop-color="#fff" stop-opacity="0.95"/>
  </linearGradient>
  <mask id="dotmask">
    <rect width="1280" height="320" fill="url(#fade)"/>
  </mask>
</defs>

<rect x="0.5" y="0.5" width="1279" height="319" rx="16" fill="url(#bg)" stroke="#d5dde8"/>
<rect width="1280" height="320" rx="16" fill="url(#glow)"/>
<rect width="1280" height="320" rx="16" fill="url(#dots)" mask="url(#dotmask)"/>

<!-- Left Brand & Copy -->
<g transform="translate(64, 52)">
  <!-- Tailscale-style 3x3 mesh emblem -->
  <circle cx="4" cy="4" r="3" fill="#b6c2d2"/>
  <circle cx="15" cy="4" r="3" fill="#3584e4"/>
  <circle cx="26" cy="4" r="3" fill="#b6c2d2"/>
  <circle cx="4" cy="15" r="3" fill="#3584e4"/>
  <circle cx="15" cy="15" r="3" fill="#1c71d8"/>
  <circle cx="26" cy="15" r="3" fill="#3584e4"/>
  <circle cx="4" cy="26" r="3" fill="#b6c2d2"/>
  <circle cx="15" cy="26" r="3" fill="#26a269"/>
  <circle cx="26" cy="26" r="3" fill="#b6c2d2"/>

  <rect x="42" y="2" width="112" height="26" rx="6" fill="#edf4fd" stroke="#bfd6f6"/>
  <text x="98" y="19" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="600" fill="#1c71d8">taildrop-gui</text>
</g>

<text x="64" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="52" font-weight="700" letter-spacing="-1.2" fill="#0f172a">Taildrop to Mac</text>
<text x="64" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="20" fill="#475569">Drop files and folders on Ubuntu.</text>
<text x="64" y="207" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="20" fill="#475569">Receive them on your Mac over Tailscale.</text>

<rect x="64" y="238" width="166" height="30" rx="15" fill="#ffffff" stroke="#cfd8e5"/><text x="147" y="258" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#334155">GTK4 + Libadwaita</text>
<rect x="240" y="238" width="154" height="30" rx="15" fill="#ffffff" stroke="#cfd8e5"/><text x="317" y="258" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#334155">Auto-Zip Folders</text>
<rect x="404" y="238" width="166" height="30" rx="15" fill="#ffffff" stroke="#cfd8e5"/><text x="487" y="258" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#334155">Tailscale Taildrop</text>

