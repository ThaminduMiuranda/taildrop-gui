<path d="M695 193a1.5 1.5 0 0 1 1.5-1.5h4l2 2h7a1.5 1.5 0 0 1 1.5 1.5v8.5a1.5 1.5 0 0 1-1.5 1.5h-13a1.5 1.5 0 0 1-1.5-1.5v-10.5z" fill="none" stroke="#3584e4" stroke-width="1.5"/>
<text x="716" y="198" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#1e293b">project-assets</text>
<text x="716" y="211" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="9.5" fill="#64748b">Folder -&gt; .zip</text>
<rect x="844" y="192" width="42" height="16" rx="8" fill="#e6f0fc"/><text x="865" y="203" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="600" fill="#1c71d8">Ready</text>

<!-- Send Pill Button -->
<rect x="672" y="238" width="236" height="32" rx="16" fill="#3584e4"/>
<text x="790" y="258" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#ffffff">Send (2)</text>

