name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install GTK4, Libadwaita, Xvfb, and dpkg-dev
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 xvfb dpkg-dev

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Run unit and security tests
        run: xvfb-run -a uv run pytest -v

      - name: Run GTK self-test
        run: xvfb-run -a ./taildrop_gui.py --self-test

      - name: Build Python package, standalone executable, and .deb
        run: |
          uv build
          python3 scripts/build_artifacts.py

      - name: Smoke-test built standalone executable
        run: xvfb-run -a ./dist/taildrop-gui --self-test

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: taildrop-gui-artifacts
          path: dist/*

      - name: Create GitHub Release on tag push
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/taildrop-gui
            dist/*.deb
            dist/*.whl
            dist/*.tar.gz
